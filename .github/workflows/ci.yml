name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # darwin is compiled here because the release ships two darwin
        # binaries, and a tag is a bad time to discover they do not build.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # After the toolchain: the cache key includes the rustc version, so
      # selecting it first is what makes the key stable.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # The flake is how this reaches people, so it is checked too: the package,
  # the apps, the dev shell and the flake-parts module all have to evaluate
  # and build. The package build runs the behaviour suite again, which is
  # the price of knowing the Nix path is not quietly broken.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The crate dependencies are built from source rather than fetched from
      # cache.nixos.org, so a cold runner pays for all of them every push and
      # nothing else in this workflow restores them. Keyed on the lock files,
      # because those are what the dependency builds are derived from; a
      # change to src/ still reuses them.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check the flake
        run: nix flake check
