name: release

on:
  push:
    tags: ["v*"]
  # A tag push fires once. When a release build fails, this re-runs it
  # against the same tag using whatever `release.yml` is on the branch you
  # dispatch from — so a fix does not need the tag to move.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release; must be the version in Cargo.toml"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed ref, or the one asked for by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target is built natively, so nothing is cross-compiled and
          # nothing is tested under emulation. Linux ships a static musl
          # build — it runs anywhere, including musl-only systems and older
          # distros. The Nix build keeps glibc, which is right for that
          # channel.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            musl: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            musl: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: The tag is the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agent-assets") | .version')
          echo "version=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG is not v$version"
            exit 1
          fi

      - name: musl libc
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: The behaviour suite passes before anything ships
        run: cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          archive="agent-assets-$version-${{ matrix.target }}"
          stage="$(mktemp -d)/$archive"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/agent-assets" "$stage/"
          cp -r docs spec.json README.md LICENSE "$stage/"
          # The contents sit at the archive root, so `curl | tar xz` leaves
          # the binary where the shell is standing.
          tar czf "$archive.tar.gz" -C "$stage" \
            agent-assets docs spec.json README.md LICENSE

      # Nothing else in this workflow ever opens an archive, and the tarball
      # is what cargo binstall and mise unpack. Run the binary out of it
      # before the artifact is uploaded: a binary sitting at the wrong root,
      # built at the wrong version, or carrying an empty registry is the
      # first thing a user hits, and the only thing nobody here would notice.
      - name: The archive is what the installers expect
        run: |
          stage="$(mktemp -d)"
          tar xzf "agent-assets-$version-${{ matrix.target }}.tar.gz" -C "$stage"
          test -f "$stage/agent-assets"
          test -d "$stage/docs"
          test -f "$stage/spec.json"
          test -f "$stage/README.md"
          test -f "$stage/LICENSE"
          # The version baked into the binary, not just the one in Cargo.toml.
          test "$("$stage/agent-assets" --version)" = "agent-assets $version"
          # The registry is compiled in. An empty one means build.rs never saw
          # assets/, which nothing else in the pipeline would catch.
          list="$("$stage/agent-assets" list)"
          grep -qE "^[1-9][0-9]* asset" <<<"$list"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-assets-${{ matrix.target }}
          path: agent-assets-*.tar.gz
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Before download-artifact: a checkout cleans the workspace, and the
      # tarballs have to survive it. `fetch-depth: 0` is what makes the
      # previous tag and the commit list reachable.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: SHA256SUMS
        run: sha256sum *.tar.gz > SHA256SUMS

      # Release notes come from the commits, not from GitHub's generator —
      # that one lists merged pull requests and this repository has never
      # had one. Only the subjects a reader upgrading would care about:
      # everything else is one `git log` away at the compare link.
      - name: Notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..$TAG"; else range="$TAG"; fi
          {
            echo "## What's Changed"
            echo
            git log --pretty=format:'%s (%h)' "$range" \
              | awk '/^(feat|fix|docs): / { print "- " $0 }'
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            else
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
            fi
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Spelled out rather than read from the remote, so publishing does
          # not depend on how the tree was fetched.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            *.tar.gz SHA256SUMS

  # The crate has to exist wherever the archives do, or `cargo install` and
  # the release page drift apart and nobody notices. This is the one
  # irreversible step in the process, so it runs last: the version has
  # already matched the tag, four platforms have built and tested, and the
  # GitHub release is already up.
  crates:
    name: publish to crates.io
    needs: release
    # A tag push only. `workflow_dispatch` is the recovery path for the
    # GitHub release and must not re-upload a version that is already
    # published.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: The token is configured
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; add it under Settings > Secrets and variables > Actions"
            exit 1
          fi

      # cargo publish is the one irreversible step here, and it is also the
      # first thing that ever runs `cargo package`. A dry run catches a
      # packaging failure before anything is uploaded, rather than after four
      # platforms have built and the GitHub release is already public.
      - name: The crate packages
        run: cargo publish --dry-run

      - name: Publish
        run: cargo publish
