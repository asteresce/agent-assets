[package]
name = "agent-assets"
version = "0.1.2"
edition = "2024"
# Verified by the `msrv` job in CI, not assumed: 1.85 is the floor for the
# edition, and the dependencies were checked against it rather than taken
# on trust. crates.io shows this to anyone deciding whether to install.
rust-version = "1.85"
description = "Provider-neutral shared agent assets with a small sync, check and validate engine"
license = "MIT"
repository = "https://github.com/asteresce/agent-assets"
readme = "README.md"
keywords = ["agent", "assets", "sync", "cli", "markdown"]
categories = ["command-line-utilities", "development-tools"]
# What crates.io gets. Everything else in the tree — AGENTS.md, the flake,
# .github, opencode.json, deny.toml — is this repository's own machinery.
# docs/ and spec.json are included because README links to them; assets/ and
# build.rs because the binary cannot exist without them.
include = [
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/assets/**",
    "/docs/**",
    "/spec.json",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "agent_assets"
path = "src/lib.rs"

[[bin]]
name = "agent-assets"
path = "src/main.rs"
# The binary is a thin shell over the library and carries no unit tests, so
# `cargo test` need not build a test harness for it. The behaviour suite in
# tests/ drives it as a process instead.
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[package.metadata.binstall]
# The release archives are `agent-assets-{version}-{target}.tar.gz` with the
# binary at the root. None of that is what binstall would guess: the
# `archive-suffix` for a tgz is `.tgz`, not `.tar.gz`, the format had to be
# inferred from that extension, and the defaults look for the binary inside a
# versioned directory. All three ends are spelled out rather than probed.
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
