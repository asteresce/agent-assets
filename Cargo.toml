[package]
name = "agent-assets"
version = "0.1.1"
edition = "2024"
description = "Provider-neutral shared agent assets with a small sync/check engine"
license = "MIT"
repository = "https://github.com/asteresce/agent-assets"
readme = "README.md"
keywords = ["agent", "assets", "sync", "cli", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agent_assets"
path = "src/lib.rs"

[[bin]]
name = "agent-assets"
path = "src/main.rs"
# The binary is a thin shell over the library and carries no unit tests, so
# `cargo test` need not build a test harness for it. The behaviour suite in
# tests/ drives it as a process instead.
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[package.metadata.binstall]
# The release archives are `agent-assets-{version}-{target}.tar.gz` with the
# binary at the root. None of that is what binstall would guess: the
# `archive-suffix` for a tgz is `.tgz`, not `.tar.gz`, the format had to be
# inferred from that extension, and the defaults look for the binary inside a
# versioned directory. All three ends are spelled out rather than probed.
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
