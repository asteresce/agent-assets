[package]
name = "agent-assets"
version = "0.1.0"
edition = "2024"
description = "Provider-neutral shared agent assets with a small sync/check engine"
license = "MIT"
publish = false

[lib]
name = "agent_assets"
path = "src/lib.rs"

[[bin]]
name = "agent-assets"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
